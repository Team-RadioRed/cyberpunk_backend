{% extends "main/layout.html" %}

{% block title %}Список оружия{% endblock %}

{% block content %}
<h1>Список оружия</h1>
<ul>
    {% for weapon in weapons %}
        <li>
            <a href="{% url 'weapon_detail' weapon.id %}">{{ weapon.name }}</a> (ID: {{ weapon.id }})
        </li>
    {% endfor %}
</ul>
{% endblock %}
