{% extends 'main/layout.html' %}

{% block title %}Список программ{% endblock %}

{% block content %}
    <h1>Список программ</h1>
    <ul>
        {% for program in programs %}
            <li>
                <a href="{% url 'references:program-detail' program.id %}">{{ program.name_rus }} ({{ program.name_eng }})</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
