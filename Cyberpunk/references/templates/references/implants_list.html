{% extends 'main/layout.html' %}

{% block title %}Список имплантов{% endblock %}

{% block content %}
    <h1>Список имплантов</h1>
    <ul>
        {% for implant in implants %}
            <li>
                <a href="{% url 'references:implant-detail' implant.id %}">{{ implant.name_rus }} ({{ implant.name_eng }})</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
