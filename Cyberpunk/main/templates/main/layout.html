{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <script src="https://kit.fontawesome.com/547c7c85ce.js" crossorigin="anonymous"></script>
</head>
<body>
    <aside>
        <i class="fa-solid fa-database fa-10x" style="color: #000000;"></i>
        <br>
        <span class="logo">База данных по Cyberpunk RED</span>
        <h3>Навигация</h3>
        <ul>
            <a href="{% url 'main:index' %}"><li><i class="fa-solid fa-house"></i> Главная</li></a>
            <a href="{% url 'references:implants_list' %}"><li><i class="fa-solid fa-microchip"></i> Импланты</li></a>
            <a href="{% url 'references:weapons_list' %}"><li><i class="fa-solid fa-gun"></i> Оружие</li></a>
            <a href="{% url 'references:programs_list' %}"><li><i class="fa-solid fa-square-binary"></i> Оружие</li></a>
            <a href="{% url 'references:demons_list' %}"><li><i class="fa-solid fa-bomb"></i> Оружие</li></a>
        </ul>
    </aside>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <script src="{% static 'js/sidebar.js' %}"></script>
</body>
</html>
